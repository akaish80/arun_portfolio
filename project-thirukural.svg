<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <rect width="400" height="300" fill="url(#bg-gradient)"/>
  <defs>
    <linearGradient id="bg-gradient" x1="0" y1="0" x2="400" y2="300">
      <stop offset="0%" style="stop-color:#FF6B35;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#F7931E;stop-opacity:0.2" />
    </linearGradient>
  </defs>
  
  <!-- Open Book -->
  <g transform="translate(100, 80)">
    <!-- Left page -->
    <path d="M 0 20 Q 0 0, 20 0 L 80 0 L 80 140 L 20 140 Q 0 140, 0 120 Z" 
          fill="#FFF8DC" stroke="#8B4513" stroke-width="2"/>
    
    <!-- Right page -->
    <path d="M 120 20 Q 120 0, 100 0 L 120 0 L 180 0 Q 200 0, 200 20 L 200 120 Q 200 140, 180 140 L 120 140 Z" 
          fill="#FFFACD" stroke="#8B4513" stroke-width="2"/>
    
    <!-- Book spine -->
    <rect x="95" y="0" width="10" height="140" fill="#8B4513"/>
    
    <!-- Tamil letter ஔ (ou) - stylized on left page -->
    <text x="35" y="50" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#D2691E">ஔ</text>
    
    <!-- Tamil letter வா on left page -->
    <text x="25" y="90" font-family="Arial, sans-serif" font-size="28" fill="#CD853F">வா</text>
    
    <!-- Tamil number/text on right page -->
    <text x="135" y="50" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#D2691E">குறள்</text>
    
    <!-- Decorative lines on left page -->
    <line x1="15" y1="105" x2="75" y2="105" stroke="#DAA520" stroke-width="1.5"/>
    <line x1="15" y1="115" x2="70" y2="115" stroke="#DAA520" stroke-width="1.5"/>
    <line x1="15" y1="125" x2="65" y2="125" stroke="#DAA520" stroke-width="1.5"/>
    
    <!-- Decorative lines on right page -->
    <line x1="130" y1="70" x2="180" y2="70" stroke="#DAA520" stroke-width="1.5"/>
    <line x1="130" y1="80" x2="185" y2="80" stroke="#DAA520" stroke-width="1.5"/>
    <line x1="130" y1="90" x2="175" y2="90" stroke="#DAA520" stroke-width="1.5"/>
    <line x1="130" y1="100" x2="180" y2="100" stroke="#DAA520" stroke-width="1.5"/>
  </g>
  
  <!-- Decorative Tamil Om symbol -->
  <circle cx="80" cy="50" r="25" fill="none" stroke="#FF6B35" stroke-width="2" opacity="0.6"/>
  <text x="80" y="60" font-family="Arial, sans-serif" font-size="32" fill="#FF6B35" text-anchor="middle" opacity="0.8">ௐ</text>
  
  <!-- Decorative elements - dots pattern -->
  <circle cx="320" cy="60" r="4" fill="#F7931E" opacity="0.7"/>
  <circle cx="335" cy="70" r="3" fill="#FF6B35" opacity="0.6"/>
  <circle cx="310" cy="80" r="3.5" fill="#F7931E" opacity="0.7"/>
  
  <circle cx="70" cy="240" r="4" fill="#F7931E" opacity="0.7"/>
  <circle cx="85" cy="250" r="3" fill="#FF6B35" opacity="0.6"/>
  <circle cx="60" cy="260" r="3.5" fill="#F7931E" opacity="0.7"/>
</svg>